<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-BTN Customer Care</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #f8f8f8;
        }

        .nav-wrapper {
            background: white;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 500;
            color: #333;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            align-items: center;
        }

        .nav-link {
            text-decoration: none;
            color: #666;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 0.5rem 0;
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: #333;
        }

        .nav-link.active {
            color: #125EFA;
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: red;
        }

        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 1rem;
            }

            .nav-links {
                gap: 1.5rem;
            }
        }

        @media (max-width: 640px) {
            .nav-links {
                display: none;
            }
        }

        .content {
            margin-top: 80px;
            padding: 2rem;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        .brand {
            display: flex;
            align-items: center;
        }
        
        .logo {
            height: 40px;
            width: auto; 
        }

        .background-city-fixed {
            position: fixed;
            top: 0px; 
            left: 0;
            width: 100%;
            height: 600px;
            background-image: url('img/test1.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.2;
            display: block;
            z-index: -1;
        }

        .breadcrumb {
            font-size: 14px;
            color: #666;
            margin: 250px 20px 0; /* Adjust top margin to ensure it appears below the background image */
            text-align: center;
            display: block;
            position: relative;
            z-index: 1;
        }

        .breadcrumb a {
            text-decoration: none;
            color: #125efa;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }
        
        /* Section Title */
        .section-title {
            text-align: left;
            margin: 130px 0;
            padding: 0 20px;
            width: 50%;
            text-wrap: break-word;
        }
        
        .section-title h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }
        
        .section-title p {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
        }
        
    </style>
</head>
<body>
    <div class="nav-wrapper">
        <nav class="navbar">
            <a href="#" class="brand">
                <img src="img/logobtn.png" alt="Logo BTN" class="logo">
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link active">BERANDA</a>
                <a href="tentang.html" class="nav-link">TENTANG KAMI</a>
                <a href="layanan.html" class="nav-link">LAYANAN NASABAH</a>
                <a href="promo.html" class="nav-link">PROMO SPESIAL</a>
            </div>
        </nav>
    </div>
    <div class="content">
        <div class="customer-service">
            <div class="background-city-fixed"></div>
            
            <div class="section-title">
                <p>Layanan Kami</p>
                <h1 style="color: #125efa;">E-BTN Customer Care</h1>
                <p>Layanan untuk nasabah Bank BTN seputar Produk, Informasi Layanan, Klaim, dan lainnya</p>
            </div>
        </div>
        <div class="breadcrumb">
            <a href="index.html", style="color: gray;">Beranda</a>
        </div>
        <hr style="height:0.1px;border-width:0;color:gray;background-color:gray;margin-top:20px;">
    </div>
</body>
</html>
