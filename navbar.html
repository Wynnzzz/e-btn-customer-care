<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="refresh" content="60">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>E-BTN Customer Care</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            }
    
            body {
                background-color: #f8f8f8;
            }
    
            .nav-wrapper {
                background: white;
                box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
                position: fixed;
                width: 100%;
                top: 0;
                z-index: 1000;
            }
    
            .navbar {
                max-width: 1200px;
                margin: 0 auto;
                padding: 1rem 2rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
    
            .brand {
                font-size: 1.25rem;
                font-weight: 500;
                color: #333;
                text-decoration: none;
            }
    
            .nav-links {
                display: flex;
                gap: 2.5rem;
                align-items: center;
            }
    
            .nav-link {
                text-decoration: none;
                color: #666;
                font-size: 0.95rem;
                font-weight: 500;
                padding: 0.5rem 0;
                position: relative;
                transition: color 0.3s ease;
            }
    
            .nav-link:hover {
                color: #333;
            }
    
            .nav-link.active {
                color: #125EFA;
            }
    
            .nav-link.active::after {
                content: '';
                position: absolute;
                bottom: -2px;
                left: 0;
                width: 100%;
                height: 2px;
                background-color: #125EFA;
            }
    
            .theme-toggle {
                background: none;
                border: none;
                cursor: pointer;
                padding: 0.5rem;
                display: flex;
                align-items: center;
                justify-content: center;
            }
    
            /* Responsive design */
            @media (max-width: 768px) {
                .navbar {
                    padding: 1rem;
                }
    
                .nav-links {
                    gap: 1.5rem;
                }
            }
    
            @media (max-width: 640px) {
                .nav-links {
                    display: none;
                }
            }
    
            /* Demo content */
            .content {
                margin-top: 80px;
                padding: 2rem;
                max-width: 1200px;
                margin-left: auto;
                margin-right: auto;
            }
            .brand {
                display: flex;
                align-items: center;
            }
            
            .logo {
                height: 40px; /* Adjust this value based on your logo size */
                width: auto; /* This maintains aspect ratio */
            }
        </style>
    </head>
    <body>
        <div class="nav-wrapper">
            <nav class="navbar">
                <a href="#" class="brand">
                    <img src="img/logobtn.png" alt="Logo BTN" class="logo">
                </a>
                <div class="nav-links">
                    <a href="#" class="nav-link active">BERANDA</a>
                    <a href="#" class="nav-link">TENTANG KAMI</a>
                    <a href="#" class="nav-link">PROMO SPESIAL</a>
                    <a href="#" class="nav-link">LAYANAN NASABAH</a>
                </div>
            </nav>
        </div>
    </body>
    
</html>
